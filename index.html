    <!-- Apply the saved / system theme before first paint (no flash of the wrong theme).
         Mirrors STORAGE_KEY and resolveTheme() in src/theme/theme.js. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("hridoy:theme");
          theme = saved === "light" || saved === "dark" ? saved
            : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "light") document.querySelector('meta[name="theme-color"]').content = "#f6f8fa";
      })();
    </script>
