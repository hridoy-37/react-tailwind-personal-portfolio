  <!-- The "H" Monogram -->
  <path d="M30 30V70M70 30V70M30 50H70" stroke="#f0f2f5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The Signature Primary Teal Dot -->
  <circle cx="78" cy="72" r="8" fill="#20b2a6" />

  <!-- Subtle Glow Effect on the Dot -->
